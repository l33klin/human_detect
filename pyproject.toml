[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-detect"
version = "0.1.0"
description = "Local Coral Edge TPU person, face and identity detection service"
requires-python = ">=3.9,<3.13"
dependencies = [
  "fastapi>=0.115.6,<0.129",
  "uvicorn>=0.30,<0.40",
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.10,<4.12",
  "Pillow>=11.1,<12",
  "pydantic-settings>=2.7,<2.12",
  "tflite==2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29", "ruff>=0.9"]

[project.scripts]
human-detect = "human_detect.cli:main"

[tool.setuptools.packages.find]
include = ["human_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
